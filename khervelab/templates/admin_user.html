{% extends "base.html" %}
{% block title %}{{ u.full_name }}{% endblock %}
{% block content %}
<h1>{{ u.full_name }} <span class="muted small">({{ u.username }})</span></h1>
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf_token }}">
<div class="card">
  <div class="row">
    <div><label>Full name</label><input type="text" name="full_name" value="{{ u.full_name }}"></div>
    <div><label>Email</label><input type="email" name="email" value="{{ u.email }}"></div>
    <div><label>Group / supervisor</label><input type="text" name="group_name" value="{{ u.group_name }}"></div>
  </div>
  <div class="row">
    <div><label>Rate category</label><select name="category">{% for c in categories %}<option {% if u.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
    <div><label>Role</label><select name="role"><option value="user" {% if u.role == 'user' %}selected{% endif %}>User</option><option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Lab manager (administrator)</option></select></div>
    <div><label>Status</label><select name="status">{% for s in ('pending','active','disabled') %}<option {% if u.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
  </div>
  <label>Set a new password (leave empty to keep)</label><input type="password" name="new_password" autocomplete="new-password">
</div>
<div class="card">
  <h2 style="margin-top:0">Trained on</h2>
  <div class="grid" style="gap:2px 14px">
  {% for i in instruments %}<label class="check"><input type="checkbox" name="auth_{{ i.id }}" {% if i.id in authorised %}checked{% endif %}> {{ i.name }}</label>{% endfor %}
  </div>
</div>
<div class="actions"><button class="primary">Save</button> <a href="{{ url_for('admin_users') }}">Cancel</a>
  <a href="{{ url_for('admin_reports', user=u.id) }}">Usage and costs for {{ u.full_name }}</a></div>
</form>
{% endblock %}
