{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<h1>My account</h1>
<div class="row">
<div class="card">
<h2 style="margin-top:0">Details</h2>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="action" value="details">
  <label>Full name</label><input type="text" name="full_name" value="{{ me.full_name }}">
  <label>Email</label><input type="email" name="email" value="{{ me.email }}">
  <label>Group / supervisor</label><input type="text" name="group_name" value="{{ me.group_name }}">
  <p class="small muted">Username: {{ me.username }} · rate category: {{ me.category or '—' }} (set by the lab manager)</p>
  <button class="primary">Save</button>
</form>
</div>
<div class="card">
<h2 style="margin-top:0">Password</h2>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="action" value="password">
  <label>Current password</label><input type="password" name="current" required autocomplete="current-password">
  <label>New password</label><input type="password" name="password" required autocomplete="new-password">
  <label>Repeat new password</label><input type="password" name="password2" required autocomplete="new-password">
  <div class="actions"><button class="primary">Change password</button></div>
</form>
</div>
</div>
{% endblock %}
