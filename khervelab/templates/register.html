{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:20px auto">
<h1>Create an account</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="row">
    <div><label>Full name</label><input type="text" name="full_name" required value="{{ form.get('full_name', '') }}"></div>
    <div><label>Email</label><input type="email" name="email" required value="{{ form.get('email', '') }}"></div>
  </div>
  <div class="row">
    <div><label>Group / supervisor</label><input type="text" name="group_name" value="{{ form.get('group_name', '') }}"></div>
    <div><label>Category</label><select name="category">{% for c in categories %}<option {% if form.get('category') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
  </div>
  <div class="row">
    <div><label>Username</label><input type="text" name="username" required value="{{ form.get('username', '') }}" autocomplete="username"></div>
    <div><label>Password (8+ characters)</label><input type="password" name="password" required autocomplete="new-password"></div>
    <div><label>Repeat password</label><input type="password" name="password2" required autocomplete="new-password"></div>
  </div>
  <div class="actions"><button class="primary">Create account</button> <a href="{{ url_for('login') }}">I already have one</a></div>
</form>
</div>
{% endblock %}
