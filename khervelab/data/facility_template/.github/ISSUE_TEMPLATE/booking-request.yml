name: Booking request
description: Ask the facility manager for an instrument slot
title: "Booking request: "
labels: ["booking-request"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the slot you want. The facility manager approves, declines or
        proposes another time, and replies here. Please do not put names,
        emails or confidential sample details in this public form.
  - type: input
    id: instrument
    attributes:
      label: Instrument
      description: Instrument id or name, e.g. xps
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD
      placeholder: "2026-10-07"
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Start time
      description: 24-hour clock, e.g. 09:00
      placeholder: "09:00"
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Duration (hours)
      placeholder: "2"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What you will measure (one or two lines)
  - type: input
    id: samples
    attributes:
      label: Samples
      description: Sample ids, comma separated (e.g. S-2026-0012)
