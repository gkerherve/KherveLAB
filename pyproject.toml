[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khervelab"
dynamic = ["version"]
description = "Instrument booking, approval and cost reports for a single research lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gwilherm Kerherve" }]
dependencies = ["PyQt6>=6.5", "Flask>=3.0", "waitress>=3.0", "reportlab>=4", "openpyxl>=3.1", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
KherveLAB = "khervelab.server:main"

[tool.setuptools.packages.find]
include = ["khervelab*"]

[tool.setuptools.package-data]
khervelab = ["templates/*.html", "static/*"]

[tool.setuptools.dynamic]
version = { attr = "khervelab.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
