[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khervelab"
dynamic = ["version"]
description = "Instrument booking, approval and cost reports for a single research lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gwilherm Kerherve" }]
dependencies = ["Flask>=3.0", "waitress>=3.0", "reportlab>=4", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
khervelab = "khervelab.server:main"

[tool.setuptools.packages.find]
include = ["khervelab*"]

[tool.setuptools.package-data]
khervelab = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "khervelab.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
